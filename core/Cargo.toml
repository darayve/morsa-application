[package]
name = "morsa_core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Núcleo de processamento de arquivos do Morsa: recebe bytes e opções, devolve bytes."
publish = false

[lib]
# cdylib: biblioteca dinâmica que o app desktop carrega (e que vira .wasm na web).
# staticlib: usada pelo cargokit em algumas plataformas (macOS).
# rlib: permite que os testes em tests/ e os exemplos usem o crate normalmente.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Ponte com o Flutter. A versão precisa ser idêntica à do pacote Dart.
flutter_rust_bridge = "=2.13.0"
# Decodificação e codificação de imagens. Só os formatos da matriz (§5.1) são
# ligados, o que mantém o binário pequeno.
image = { version = "0.25.10", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "tiff", "ico", "webp",
] }
# WebP com perdas (VP8). Rust puro, de propósito: a libwebp é código C e não
# compila para WebAssembly sem uma toolchain extra (decisão DC17). O WebP sem
# perdas usa o codificador do próprio `image`.
oxideav-webp = { version = "0.3.1", default-features = false }
# GIF: o `image` não dá controle de paleta nem de dithering, então o quadro
# indexado é montado aqui e gravado com o crate `gif`.
gif = { version = "0.14", default-features = false, features = ["std"] }
color_quant = "1.1"
# TIFF: o `image` só grava sem compressão; o crate `tiff` dá LZW e Deflate.
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
# SVG → pixels, sem rede e sem acesso a arquivos.
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
# Conversão de perfis ICC para sRGB (mesma versão que o `image` já usa).
moxcms = "0.8.1"

[lints.clippy]
# O clippy sugere `as_chunks::<4>()` no lugar de `chunks_exact(4)`. Para ler
# pixels (RGBA = 4 bytes) o `chunks_exact(4)` é mais direto, e o resto do
# projeto inteiro usa esse jeito.
chunks_exact_to_as_chunks = "allow"

[lints.rust]
# O FRB usa este cfg no código gerado.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
# Só para gerar o corpus de teste: JPEG em CMYK, que o `image` não grava.
jpeg-encoder = "0.7"

# Testes e desenvolvimento: as dependências (codecs de imagem) compilam
# otimizadas, senão decodificar uma imagem de 6 MP leva minutos em modo debug.
[profile.dev.package."*"]
opt-level = 3
