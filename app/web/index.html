<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Morsa: utilitários para arquivos, 100% offline. Nenhum arquivo sai do seu computador.">

  <!--
    Zero rede (RNF10, SEG13): só a própria origem é permitida.
    - 'wasm-unsafe-eval': necessário para compilar o WebAssembly (Flutter e núcleo Rust).
    - 'unsafe-eval': desvio registrado do SEG13 (requisitos §20, DC13). O
      flutter_rust_bridge avalia dois textos fixos da própria biblioteca
      (expor o módulo WASM e achar o caminho do script dos workers). Nada
      vindo do usuário ou da rede é avaliado, e o bloqueio de rede não muda.
    - blob: os Web Workers do núcleo e os downloads gerados localmente usam URLs blob:.
    - 'unsafe-inline' em estilos: o motor do Flutter injeta estilos no DOM.
    Os cabeçalhos COOP/COEP (necessários para os workers) não podem ir em <meta>;
    são definidos pelo servidor (ver scripts/serve_web.py).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Morsa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Morsa</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { background: #fafaf8; margin: 0; }</style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
